[package]
name = "irontide-wasm"
version = "0.1.0"
edition = "2021"
description = "Iron Tide RTS - WebAssembly bindings"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
irontide-core = { path = "../irontide-core" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
