<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Uprising — Sealed Watch v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
:root {
  --bg:#06080a; --panel:#0c0e12; --border:#1a1d24; --blt:#252830;
  --text:#c8ccd4; --dim:#5a5e68; --muted:#3a3d44;
  --scout:#4a9eff; --relay:#8b8fa8; --striker:#ff6b35;
  --danger:#ff3b4a; --signal:#22d68a; --warn:#ffaa22; --inspect:#4ccce6;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* TICK CLOCK HEADER */
.clock-bar{height:64px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);flex-shrink:0;position:relative;background:var(--panel)}
.clock-left,.clock-right{position:absolute;top:0;height:100%;display:flex;align-items:center;padding:0 20px}
.clock-left{left:0;gap:12px}
.clock-right{right:0;gap:16px}
.badge{font-size:9px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:2px;color:#fff}
.badge-sealed{background:var(--danger);animation:pulse 2s ease-in-out infinite}
.badge-inspector{background:var(--inspect);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.mlabel{font-size:10px;color:var(--dim);letter-spacing:1px}
.noskip{font-size:9px;color:var(--muted);letter-spacing:1px;border:1px solid var(--border);padding:2px 8px;border-radius:2px}

/* The clock itself */
.tick-clock{display:flex;align-items:center;gap:3px}
.tick-pip{width:18px;height:28px;border-radius:3px;border:1px solid var(--border);background:#08090c;transition:all .15s;position:relative;overflow:hidden}
.tick-pip.filled{background:var(--warn);border-color:var(--warn)}
.tick-pip.filled::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,transparent 50%)}
.tick-pip.current{border-color:var(--warn);box-shadow:0 0 12px rgba(255,170,34,.4)}
.tick-pip.fired{animation:tick-fire .4s ease}
@keyframes tick-fire{0%{background:#ffaa22;box-shadow:0 0 20px rgba(255,170,34,.6)}100%{}}
.tick-num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--warn);min-width:50px;text-align:center;margin:0 8px}
.tick-total{font-size:12px;color:var(--muted);margin-left:2px}

/* MAIN */
.main{flex:1;display:grid;grid-template-columns:1fr 280px;overflow:hidden}

/* BATTLEFIELD */
.bf{position:relative;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:0;position:relative}
.cell{width:var(--cell);height:var(--cell);border:1px solid #1e222e;position:relative;transition:background .15s}
.cell.even{background:#0e1118}
.cell.odd{background:#0b0d12}
.cell.flash-signal{animation:cell-flash-sig .5s ease}
.cell.flash-combat{animation:cell-flash-combat .5s ease}
@keyframes cell-flash-sig{0%{background:rgba(34,214,138,.15)}50%{background:rgba(34,214,138,.05)}100%{}}
@keyframes cell-flash-combat{0%{background:rgba(255,59,74,.2)}50%{background:rgba(255,59,74,.05)}100%{}}
/* Corner ticks */
.cell::before{content:'';position:absolute;top:0;left:0;width:5px;height:5px;border-top:1.5px solid #2a2f3e;border-left:1.5px solid #2a2f3e}
.cell::after{content:'';position:absolute;bottom:0;right:0;width:5px;height:5px;border-bottom:1.5px solid #2a2f3e;border-right:1.5px solid #2a2f3e}

/* Axis labels */
.axis-col{display:flex;justify-content:center}
.axis-col-inner{display:grid;grid-template-columns:repeat(8,var(--cell));gap:0}
.axis-label{text-align:center;font-size:10px;font-weight:600;color:#2a2f3e;padding:4px 0}
.axis-row{position:absolute;left:-24px;top:0;display:flex;flex-direction:column;height:100%}
.axis-row .axis-label{height:var(--cell);display:flex;align-items:center;justify-content:center}

/* UNIT on cell */
.unit-icon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:4px;z-index:2;transition:transform .08s}
.unit-icon.jitter{animation:jitter .15s infinite}
@keyframes jitter{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px)}100%{transform:translate(0,0)}}

.unit-shape{font-size:calc(var(--cell) * .3);font-weight:700;line-height:1}
.unit-label{font-size:max(calc(var(--cell) * .12),8px);font-weight:600;letter-spacing:1px;margin-top:1px;opacity:.9}

/* Buffer bar above unit */
.buf-bar{position:absolute;bottom:2px;left:4px;right:4px;height:4px;display:flex;gap:1px;z-index:3}
.buf-pip{flex:1;height:100%;background:#1a1d24;border-radius:1px;transition:background .2s}
.buf-pip.threat{background:var(--danger)}
.buf-pip.signal{background:var(--signal)}
.buf-pip.noise{background:var(--warn)}
.buf-pip.flash{animation:buf-flash .4s ease}
@keyframes buf-flash{0%{background:#fff}100%{}}

/* Enemy */
.enemy-icon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2}
.enemy-shape{font-size:calc(var(--cell) * .35);line-height:1}
.enemy-dead{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * .3);color:#4a2020;z-index:1}

/* Signal flash line */
.sig-line{position:absolute;pointer-events:none;z-index:5}

/* Hook wire overlay */
.hook-line{position:absolute;pointer-events:none;z-index:1;opacity:.12}
.hook-line.active{opacity:.35}

/* SIDEBAR */
.sb{border-left:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;background:var(--panel)}
.sb-sec{padding:12px 14px;border-bottom:1px solid var(--border)}
.sb-sec h3{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.bu{margin-bottom:10px}
.bu-hdr{display:flex;justify-content:space-between;margin-bottom:3px}
.bu-name{font-size:10px;font-weight:500}
.bu-name.scout{color:var(--scout)}.bu-name.relay{color:var(--relay)}.bu-name.striker{color:var(--striker)}
.bu-cnt{font-size:10px;font-variant-numeric:tabular-nums}
.bu-cnt.ok{color:var(--dim)}.bu-cnt.warn{color:var(--warn)}.bu-cnt.full{color:var(--danger);font-weight:700}
.bu-slots{display:flex;gap:2px}
.bs{flex:1;height:14px;border-radius:1px;background:#0a0c10;border:1px solid var(--border);transition:all .2s}
.bs.threat{background:linear-gradient(135deg,#2a1510,#1a0a08);border-color:#4a2520}
.bs.signal{background:linear-gradient(135deg,#0a2a18,#081a10);border-color:#1a4a2a}
.bs.noise{background:linear-gradient(135deg,#1a1510,#120e0a);border-color:#2a2420}

/* Hook panel */
.hk{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:10px}
.hk-st{margin-left:auto;font-size:8px;padding:1px 5px;border-radius:2px;letter-spacing:.5px}
.hk-st.idle{color:var(--muted);border:1px solid var(--border)}
.hk-st.firing{color:var(--signal);border:1px solid var(--signal);background:rgba(34,214,138,.08)}

/* Log */
.slog{max-height:140px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.le{font-size:9px;padding:2px 0;color:var(--dim);border-bottom:1px solid var(--border);display:flex;gap:6px}
.le-t{color:var(--muted);min-width:22px;font-variant-numeric:tabular-nums}
.le.dropped{color:var(--danger)}.le.success{color:var(--signal)}.le.combat{color:var(--striker)}

/* Toast */
.toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--panel);border:1px solid var(--blt);padding:8px 20px;border-radius:4px;font-size:11px;opacity:0;transition:all .4s;pointer-events:none;z-index:50;text-align:center}
.toast.vis{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.danger{border-color:var(--danger);color:var(--danger)}
.toast.warn{border-color:var(--warn);color:var(--warn)}
.toast.info{border-color:var(--inspect);color:var(--inspect)}

/* Controls */
.ctrls{height:46px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:10px;flex-shrink:0;background:var(--panel)}
.cb{background:none;border:1px solid var(--border);color:var(--dim);font-family:inherit;font-size:11px;padding:5px 12px;border-radius:3px;cursor:pointer;transition:all .15s}
.cb:hover{border-color:var(--warn);color:var(--warn)}
.cb.act{border-color:var(--warn);color:var(--warn);background:rgba(255,170,34,.06)}
.cb.pri{border-color:var(--signal);color:var(--signal)}
.csep{color:var(--border);font-size:11px}
.clbl{font-size:9px;color:var(--muted);letter-spacing:1px}

/* Inspector controls */
.scrubber{display:flex;align-items:center;gap:8px}
.scrub-track{flex:1;height:6px;background:var(--border);border-radius:3px;position:relative;cursor:pointer;min-width:180px}
.scrub-fill{height:100%;background:var(--inspect);border-radius:3px;transition:width .1s}
.scrub-handle{position:absolute;top:-5px;width:16px;height:16px;background:var(--inspect);border-radius:50%;transform:translateX(-8px);cursor:grab;box-shadow:0 0 8px rgba(76,204,230,.4);transition:left .1s}

/* Queue depth */
.qchart{position:relative;height:90px;background:#08090c;border:1px solid var(--border);border-radius:3px;margin-top:6px}
.qchart canvas{width:100%;height:100%}

/* Inspector detail */
.insp-detail{font-size:10px;color:var(--dim);line-height:1.7}
.insp-detail .row{display:flex;justify-content:space-between}
.insp-detail .v{color:var(--text)}.insp-detail .v.bad{color:var(--danger)}.insp-detail .v.good{color:var(--signal)}
.insp-detail .dropped-entry{color:var(--danger);padding:4px 0;border-top:1px solid var(--border);margin-top:4px}
</style>
</head>
<body>

<div class="clock-bar">
  <div class="clock-left">
    <div class="badge badge-sealed" id="modeBadge">SEALED WATCH</div>
    <div class="mlabel">MISSION 3 — BLIND SPOTS</div>
  </div>
  <div style="display:flex;align-items:center;gap:4px">
    <div class="tick-clock" id="tickClock"></div>
    <div class="tick-num" id="tickNum">0</div>
    <div class="tick-total">/ <span id="tickMax">20</span></div>
  </div>
  <div class="clock-right">
    <div class="noskip" id="noskipBadge">NO SKIP</div>
  </div>
</div>

<div class="main">
  <div class="bf" id="bfContainer">
    <div style="position:relative">
      <div class="axis-row" id="axisRow"></div>
      <div class="board" id="board"></div>
      <div class="axis-col"><div class="axis-col-inner" id="axisCol"></div></div>
    </div>
  </div>
  <div class="sb" id="sidebar"></div>
</div>

<div id="ctrlWatch" class="ctrls">
  <button class="cb pri" onclick="startSim()" id="startBtn">Start</button>
  <span class="csep">|</span>
  <button class="cb" onclick="setSpd(2000)" id="s1">0.5x</button>
  <button class="cb act" onclick="setSpd(1000)" id="s2">1x</button>
  <button class="cb" onclick="setSpd(500)" id="s3">2x</button>
  <span class="csep">|</span>
  <span class="clbl" id="spdLbl">1s / tick</span>
</div>

<div id="ctrlInspect" class="ctrls" style="display:none">
  <button class="cb" onclick="inspPrev()">← Prev</button>
  <div class="scrubber">
    <span class="clbl" id="inspTickLbl">Tick 0</span>
    <div class="scrub-track" id="scrubTrack" onclick="scrubClick(event)">
      <div class="scrub-fill" id="scrubFill"></div>
      <div class="scrub-handle" id="scrubHandle"></div>
    </div>
  </div>
  <button class="cb" onclick="inspNext()">Next →</button>
  <span class="csep">|</span>
  <button class="cb" onclick="resetSim()" style="border-color:var(--inspect);color:var(--inspect)">Restart</button>
</div>

<div class="toast" id="toast"></div>

<script>
const GW=8, GH=8;
let tick=0, maxTick=20, speed=1000, running=false, timer=null;
let mode='watch', inspTick=0, selectedUnit=null;
let totalSent=0, totalDropped=0;
let history=[], dropLog=[], logEntries=[];

// === UNITS (grid-snapped integer positions) ===
function makeUnits(){return{
  S1:{t:'scout',x:0,y:0,buf:[],max:6,perc:3,alive:true,label:'S₁',color:'#4a9eff',patrol:[[0,0],[2,0],[3,1],[1,2]],pi:0},
  S2:{t:'scout',x:0,y:4,buf:[],max:6,perc:3,alive:true,label:'S₂',color:'#4a9eff',patrol:[[0,4],[2,3],[3,5],[1,5]],pi:0},
  S3:{t:'scout',x:0,y:7,buf:[],max:6,perc:3,alive:true,label:'S₃',color:'#4a9eff',patrol:[[0,7],[2,6],[3,7],[1,7]],pi:0},
  R1:{t:'relay',x:2,y:3,buf:[],max:12,perc:0,alive:true,label:'◈',color:'#8b8fa8'},
  K1:{t:'striker',x:5,y:2,buf:[],max:8,perc:2,alive:true,label:'K₁',color:'#ff6b35',target:null},
  K2:{t:'striker',x:5,y:6,buf:[],max:8,perc:2,alive:true,label:'K₂',color:'#ff6b35',target:null},
}}
function makeEnemies(){return[
  {x:4,y:0,alive:true,patrol:[[4,0],[5,1],[4,0]],pi:0},
  {x:6,y:1,alive:true,patrol:[[6,1],[7,2],[6,3],[6,1]],pi:0},
  {x:7,y:3,alive:true,patrol:[[7,3],[7,5],[7,3]],pi:0},
  {x:6,y:5,alive:true,patrol:[[6,5],[7,6],[6,7],[6,5]],pi:0},
  {x:3,y:7,alive:true,patrol:[[3,7],[5,7],[3,7]],pi:0},
]}
let U=makeUnits(), E=makeEnemies();
const hooks=[{from:'S1',to:'K1',active:false},{from:'S2',to:'K1',active:false},{from:'S3',to:'K2',active:false}];

// === BUILD BOARD ===
function buildBoard(){
  const bf=document.getElementById('bfContainer');
  const maxH=bf.clientHeight-40, maxW=bf.clientWidth-60;
  const cellPx=Math.floor(Math.min(maxH/GH, maxW/GW, 72));
  document.documentElement.style.setProperty('--cell',cellPx+'px');

  const board=document.getElementById('board');
  board.innerHTML='';
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const c=document.createElement('div');
    c.className='cell '+((x+y)%2===0?'even':'odd');
    c.id=`c${x}_${y}`;
    c.dataset.x=x; c.dataset.y=y;
    c.addEventListener('click',()=>{if(mode==='inspector')clickCell(x,y);});
    board.appendChild(c);
  }
  // Axes
  const axCol=document.getElementById('axisCol');
  axCol.innerHTML='';
  for(let x=0;x<GW;x++){const l=document.createElement('div');l.className='axis-label';l.textContent=String.fromCharCode(65+x);axCol.appendChild(l);}
  const axRow=document.getElementById('axisRow');
  axRow.innerHTML='';
  for(let y=0;y<GH;y++){const l=document.createElement('div');l.className='axis-label';l.textContent=y+1;axRow.appendChild(l);}

  // Tick pips
  const tc=document.getElementById('tickClock');
  tc.innerHTML='';
  for(let i=1;i<=maxTick;i++){const p=document.createElement('div');p.className='tick-pip';p.id=`pip${i}`;tc.appendChild(p);}
}

// === RENDER BOARD STATE ===
function renderBoard(){
  // Clear all cells of units/enemies
  document.querySelectorAll('.unit-icon,.enemy-icon,.enemy-dead,.buf-bar').forEach(e=>e.remove());

  // Place units
  Object.entries(U).forEach(([k,u])=>{
    if(!u.alive) return;
    const cell=document.getElementById(`c${u.x}_${u.y}`);
    if(!cell) return;
    const pr=u.buf.length/u.max;

    // Buffer bar
    const bb=document.createElement('div');
    bb.className='buf-bar';
    for(let i=0;i<u.max;i++){
      const p=document.createElement('div');
      p.className='buf-pip'+(i<u.buf.length?' '+u.buf[i].type:'');
      bb.appendChild(p);
    }
    cell.appendChild(bb);

    // Unit icon
    const icon=document.createElement('div');
    icon.className='unit-icon'+(pr>=1?' jitter':'');
    icon.style.background=pr>=1?'rgba(255,59,74,.15)':u.color+'15';
    icon.style.border=`2px solid ${pr>=1?'#ff3b4a':u.color}`;

    const shape=document.createElement('div');
    shape.className='unit-shape';
    shape.style.color=pr>=1?'#ff3b4a':u.color;
    shape.textContent=u.t==='scout'?'👁':u.t==='relay'?'📡':'⚔';

    const label=document.createElement('div');
    label.className='unit-label';
    label.style.color=pr>=1?'#ff8888':u.color;
    label.textContent=k;

    icon.appendChild(shape);
    icon.appendChild(label);

    // Inspector selection
    if(mode==='inspector'&&selectedUnit===k){
      icon.style.borderColor='#4ccce6';
      icon.style.boxShadow='0 0 12px rgba(76,204,230,.3)';
    }

    cell.appendChild(icon);
  });

  // Place enemies
  E.forEach((e,i)=>{
    const cell=document.getElementById(`c${e.x}_${e.y}`);
    if(!cell) return;
    if(!e.alive){
      const d=document.createElement('div');d.className='enemy-dead';d.textContent='☠';cell.appendChild(d);
      return;
    }
    const icon=document.createElement('div');
    icon.className='enemy-icon';
    const shape=document.createElement('div');
    shape.className='enemy-shape';
    shape.style.color='#ff3b4a';
    shape.textContent='🤖';
    icon.appendChild(shape);
    cell.appendChild(icon);
  });
}

// === TICK CLOCK ===
function updateClock(){
  for(let i=1;i<=maxTick;i++){
    const p=document.getElementById(`pip${i}`);
    p.className='tick-pip'+(i<tick?' filled':i===tick?' filled current':'');
  }
  document.getElementById('tickNum').textContent=tick;
}

function firePip(){
  const p=document.getElementById(`pip${tick}`);
  if(p) p.classList.add('fired');
}

// === CELL FLASH ===
function flashCell(x,y,type){
  const c=document.getElementById(`c${x}_${y}`);
  if(!c) return;
  c.classList.remove('flash-signal','flash-combat');
  void c.offsetWidth; // reflow
  c.classList.add(type==='combat'?'flash-combat':'flash-signal');
  setTimeout(()=>c.classList.remove('flash-signal','flash-combat'),500);
}

// === SIMULATION (discrete, grid-snapped) ===
function dist(ax,ay,bx,by){return Math.hypot(ax-bx,ay-by)}

function moveTowardGrid(u,tx,ty){
  // Move one step toward target on grid (Manhattan, one cell per tick)
  if(u.x===tx&&u.y===ty) return;
  const dx=tx-u.x, dy=ty-u.y;
  // Prefer the longer axis
  if(Math.abs(dx)>=Math.abs(dy)){
    u.x+=Math.sign(dx);
  } else {
    u.y+=Math.sign(dy);
  }
}

function snap(){
  return{
    tick,
    units:Object.fromEntries(Object.entries(U).map(([k,u])=>[k,{x:u.x,y:u.y,buf:u.buf.map(b=>({...b})),alive:u.alive}])),
    enemies:E.map(e=>({x:e.x,y:e.y,alive:e.alive})),
    hookStates:hooks.map(h=>h.active),
    totalSent,totalDropped,
  };
}
function restoreSnap(s){
  Object.entries(s.units).forEach(([k,v])=>{U[k].x=v.x;U[k].y=v.y;U[k].buf=v.buf.map(b=>({...b}));U[k].alive=v.alive;});
  s.enemies.forEach((e,i)=>{E[i].x=e.x;E[i].y=e.y;E[i].alive=e.alive;});
  hooks.forEach((h,i)=>h.active=s.hookStates[i]);
}

function simTick(){
  tick++;
  hooks.forEach(h=>h.active=false);
  firePip();

  // 1. MOVE enemies (one cell toward patrol target)
  E.forEach(e=>{
    if(!e.alive) return;
    const[tx,ty]=e.patrol[e.pi];
    moveTowardGrid(e,tx,ty);
    if(e.x===tx&&e.y===ty) e.pi=(e.pi+1)%e.patrol.length;
  });

  // 2. MOVE scouts (one cell toward patrol target)
  ['S1','S2','S3'].forEach(k=>{
    const s=U[k]; if(!s.alive) return;
    const[tx,ty]=s.patrol[s.pi];
    moveTowardGrid(s,tx,ty);
    if(s.x===tx&&s.y===ty) s.pi=(s.pi+1)%s.patrol.length;
  });

  // 3. PERCEIVE — scouts detect enemies in range
  ['S1','S2','S3'].forEach(k=>{
    const s=U[k]; if(!s.alive) return;
    E.forEach((e,ei)=>{
      if(!e.alive) return;
      if(dist(s.x,s.y,e.x,e.y)<=s.perc){
        if(s.buf.length<s.max) s.buf.push({type:'threat',enemy:ei,tick});

        // Fire hook — signal arrives THIS tick (discrete)
        const hk=hooks.find(h=>h.from===k);
        if(hk){
          hk.active=true;
          const tgt=U[hk.to];
          totalSent++;

          if(tgt.buf.length<tgt.max){
            tgt.buf.push({type:'threat',enemy:ei,tick});
            flashCell(tgt.x,tgt.y,'signal');
            logEntries.unshift({tick,text:`${k} → ${hk.to}: ▲${ei+1} delivered`,type:'success'});
          } else {
            totalDropped++;
            flashCell(tgt.x,tgt.y,'combat');
            logEntries.unshift({tick,text:`${k} → ${hk.to}: ▲${ei+1} DROPPED (${tgt.buf.length}/${tgt.max})`,type:'dropped'});
            dropLog.push({tick,unit:hk.to,enemy:ei,bufLen:tgt.buf.length,bufMax:tgt.max});
            if(totalDropped===1) showToast('SIGNAL DROPPED — buffer full','danger',3000);
            if(totalDropped===3) showToast('Multiple drops — architecture failing','danger',3000);
          }
        }
      }
    });
  });

  // 4. STRIKERS act — move toward newest threat in buffer
  ['K1','K2'].forEach(k=>{
    const u=U[k]; if(!u.alive) return;
    const threats=u.buf.filter(b=>b.type==='threat');
    if(threats.length>0){
      const newest=threats[threats.length-1];
      const e=E[newest.enemy];
      if(e&&e.alive){
        // Adjacent? Kill. (one shot one kill)
        if(dist(u.x,u.y,e.x,e.y)<=1.5){
          e.alive=false;
          flashCell(e.x,e.y,'combat');
          logEntries.unshift({tick,text:`${k} eliminated ▲${newest.enemy+1}`,type:'combat'});
          u.buf=u.buf.filter(b=>b.enemy!==newest.enemy);
        } else {
          moveTowardGrid(u,e.x,e.y);
        }
      }
    }
  });

  // 5. Buffer aging
  if(tick%4===0) Object.values(U).forEach(u=>{if(u.buf.length>0&&u.buf[0].tick<tick-5) u.buf.shift();});

  // Toasts
  if(tick===6&&U.K1.buf.length>=6) showToast('K₁ buffer filling — 2 scouts feeding it','warn',3000);
  if(tick===10){const ea=E.filter((e,i)=>[1,2].includes(i)&&e.alive).length;if(ea>0) showToast('East enemies approaching — K₁ full of north data','danger',3000);}

  // Save
  history.push(snap());
  updateClock();
  renderBoard();
  updateWatchSidebar();

  // End check
  if(E.filter(e=>e.alive).length===0){endSim(true);return;}
  if(tick>=maxTick){endSim(false);return;}
}

// === SIDEBAR: WATCH ===
function updateWatchSidebar(){
  let h='<div class="sb-sec"><h3>Buffer State</h3>';
  ['S1','S2','S3','R1','K1','K2'].forEach(k=>{
    const u=U[k];const pr=u.buf.length/u.max;const cc=pr>=1?'full':pr>.7?'warn':'ok';
    let sl='';for(let i=0;i<u.max;i++) sl+=`<div class="bs ${i<u.buf.length?u.buf[i].type:''}"></div>`;
    h+=`<div class="bu"><div class="bu-hdr"><span class="bu-name ${u.t}">${u.label} ${k}</span><span class="bu-cnt ${cc}">${u.buf.length}/${u.max}</span></div><div class="bu-slots">${sl}</div></div>`;
  });
  h+='</div><div class="sb-sec"><h3>Hook Activity</h3>';
  hooks.forEach(hk=>{const sc=hk.active?'firing':'idle';const st=hk.active?'FIRED':'IDLE';
    h+=`<div class="hk"><span style="color:var(--scout)">${hk.from}</span><span style="color:var(--muted)">→</span><span style="color:var(--striker)">${hk.to}</span><span class="hk-st ${sc}">${st}</span></div>`;
  });
  h+='</div><div class="sb-sec"><h3>Signal Log</h3><div class="slog">';
  logEntries.slice(0,20).forEach(e=>{h+=`<div class="le ${e.type}"><span class="le-t">t${e.tick}</span><span>${e.text}</span></div>`;});
  h+='</div></div>';
  document.getElementById('sidebar').innerHTML=h;
}

// === SIDEBAR: INSPECTOR ===
function updateInspSidebar(){
  const s=history[inspTick]||history[history.length-1];
  if(!s) return;
  let h='';
  const sk=selectedUnit;
  if(sk&&s.units[sk]){
    const su=s.units[sk],ud=U[sk];const pr=su.buf.length/ud.max;const cc=pr>=1?'full':pr>.7?'warn':'ok';
    h+=`<div class="sb-sec"><h3>Selected: ${ud.label} ${sk} — Tick ${s.tick}</h3>`;
    let sl='';for(let i=0;i<ud.max;i++) sl+=`<div class="bs ${i<su.buf.length?su.buf[i].type:''}"></div>`;
    h+=`<div class="bu"><div class="bu-hdr"><span class="bu-name ${ud.t}">${ud.label} ${sk}</span><span class="bu-cnt ${cc}">${su.buf.length}/${ud.max}</span></div><div class="bu-slots">${sl}</div></div>`;
    h+='<div class="insp-detail">';
    su.buf.forEach((b,i)=>{h+=`<div class="row"><span>Slot ${i+1}</span><span class="v">${b.type==='threat'?'THREAT ▲'+(b.enemy+1):'signal'} (t${b.tick})</span></div>`;});
    if(su.buf.length===0) h+='<div style="color:var(--muted)">Buffer empty</div>';
    const drops=dropLog.filter(d=>d.tick===s.tick&&d.unit===sk);
    drops.forEach(d=>{h+=`<div class="dropped-entry">DROPPED: ▲${d.enemy+1} — buffer ${d.bufLen}/${d.bufMax}</div>`;});
    h+='</div></div>';
  } else {
    h+='<div class="sb-sec"><h3>Click a unit to inspect</h3><div style="font-size:10px;color:var(--muted)">Click any unit on the board to see its buffer at this tick.</div></div>';
  }
  h+=`<div class="sb-sec"><h3>K₁ Queue Depth</h3><div class="qchart"><canvas id="qcv"></canvas></div></div>`;
  h+='<div class="sb-sec"><h3>Summary</h3><div class="insp-detail">';
  const fs=history[history.length-1];
  h+=`<div class="row"><span>Ticks</span><span class="v">${fs.tick}</span></div>`;
  h+=`<div class="row"><span>Killed</span><span class="v ${fs.enemies.filter(e=>!e.alive).length===5?'good':'bad'}">${fs.enemies.filter(e=>!e.alive).length}/5</span></div>`;
  h+=`<div class="row"><span>Signals sent</span><span class="v">${fs.totalSent}</span></div>`;
  h+=`<div class="row"><span>Signals dropped</span><span class="v ${fs.totalDropped>0?'bad':'good'}">${fs.totalDropped}</span></div>`;
  h+=`<div class="row"><span>Relay used</span><span class="v bad">No</span></div>`;
  h+='</div></div>';
  if(dropLog.length>0){
    h+='<div class="sb-sec"><h3>All Drops</h3><div class="slog">';
    dropLog.forEach(d=>{h+=`<div class="le dropped"><span class="le-t">t${d.tick}</span><span>▲${d.enemy+1} at ${d.unit} (${d.bufLen}/${d.bufMax})</span></div>`;});
    h+='</div></div>';
  }
  document.getElementById('sidebar').innerHTML=h;
  requestAnimationFrame(drawQChart);
}

function drawQChart(){
  const qcv=document.getElementById('qcv');if(!qcv)return;
  const rect=qcv.parentElement.getBoundingClientRect();
  qcv.width=rect.width*devicePixelRatio;qcv.height=rect.height*devicePixelRatio;
  qcv.style.width=rect.width+'px';qcv.style.height=rect.height+'px';
  const qx=qcv.getContext('2d');qx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const w=rect.width,h=rect.height,pad=20,pw=w-pad*2,ph=h-pad*2;
  qx.strokeStyle='#1a1d24';qx.lineWidth=1;qx.beginPath();qx.moveTo(pad,pad);qx.lineTo(pad,h-pad);qx.lineTo(w-pad,h-pad);qx.stroke();
  qx.font='8px JetBrains Mono';qx.fillStyle='#3a3d44';qx.textAlign='right';qx.textBaseline='middle';
  for(let i=0;i<=8;i+=2){const y=h-pad-ph*(i/8);qx.fillText(i,pad-4,y);}
  if(history.length<2)return;
  const barW=pw/history.length;
  history.forEach((s,i)=>{
    const v=s.units.K1?s.units.K1.buf.length:0;const bh=(v/8)*ph;const x=pad+i*barW;const y=h-pad-bh;
    const col=v>=8?'#ff3b4a':v>=6?'#ffaa22':'#22d68a';
    qx.fillStyle=col+'80';qx.fillRect(x,y,Math.max(barW-1,2),bh);
    if(i===inspTick){qx.fillStyle='#4ccce680';qx.fillRect(x-1,pad,Math.max(barW+1,3),ph);qx.fillStyle='#4ccce6';qx.fillRect(x,y,Math.max(barW-1,2),bh);}
  });
  qx.strokeStyle='#ff3b4a40';qx.lineWidth=1;qx.setLineDash([3,3]);const fy=h-pad-ph;qx.beginPath();qx.moveTo(pad,fy);qx.lineTo(w-pad,fy);qx.stroke();qx.setLineDash([]);
  qx.font='8px JetBrains Mono';qx.fillStyle='#ff3b4a60';qx.textAlign='left';qx.fillText('FULL',w-pad+3,fy);
}

// === INSPECTOR MODE ===
function endSim(won){
  running=false;clearInterval(timer);
  showToast(won?'Complete — entering Inspector':'Failed — entering Inspector',won?'info':'danger',2000);
  setTimeout(enterInspector,1500);
}
function enterInspector(){
  mode='inspector';inspTick=history.length-1;selectedUnit=null;
  document.getElementById('modeBadge').textContent='INSPECTOR';document.getElementById('modeBadge').className='badge badge-inspector';
  document.getElementById('noskipBadge').textContent='SCRUB';document.getElementById('noskipBadge').style.borderColor='var(--inspect)';document.getElementById('noskipBadge').style.color='var(--inspect)';
  document.getElementById('ctrlWatch').style.display='none';document.getElementById('ctrlInspect').style.display='flex';
  restoreSnap(history[inspTick]);updateScrub();renderBoard();updateInspSidebar();
  showToast('Click units to inspect. Scrub the timeline.','info',3000);
}
function updateScrub(){
  const pct=history.length>1?inspTick/(history.length-1)*100:0;
  document.getElementById('scrubFill').style.width=pct+'%';document.getElementById('scrubHandle').style.left=pct+'%';
  document.getElementById('inspTickLbl').textContent=`Tick ${history[inspTick]?history[inspTick].tick:0}`;
  document.getElementById('tickNum').textContent=history[inspTick]?history[inspTick].tick:0;
  // Update clock pips
  const t=history[inspTick]?history[inspTick].tick:0;
  for(let i=1;i<=maxTick;i++){const p=document.getElementById(`pip${i}`);p.className='tick-pip'+(i<t?' filled':i===t?' filled current':'');}
}
function inspPrev(){if(inspTick>0){inspTick--;restoreSnap(history[inspTick]);updateScrub();renderBoard();updateInspSidebar();}}
function inspNext(){if(inspTick<history.length-1){inspTick++;restoreSnap(history[inspTick]);updateScrub();renderBoard();updateInspSidebar();}}
function scrubClick(ev){const r=document.getElementById('scrubTrack').getBoundingClientRect();const pct=(ev.clientX-r.left)/r.width;inspTick=Math.round(pct*(history.length-1));inspTick=Math.max(0,Math.min(history.length-1,inspTick));restoreSnap(history[inspTick]);updateScrub();renderBoard();updateInspSidebar();}
function clickCell(x,y){
  let found=null;
  Object.entries(U).forEach(([k,u])=>{if(u.x===x&&u.y===y&&u.alive) found=k;});
  selectedUnit=found;
  renderBoard();updateInspSidebar();
}

// === CONTROLS ===
function showToast(text,type,dur){const t=document.getElementById('toast');t.textContent=text;t.className='toast vis'+(type?' '+type:'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',dur||2500);}
function startSim(){if(running)return;running=true;history=[snap()];document.getElementById('startBtn').textContent='Running...';document.getElementById('startBtn').style.pointerEvents='none';timer=setInterval(simTick,speed);}
function resetSim(){clearInterval(timer);running=false;mode='watch';tick=0;totalSent=0;totalDropped=0;logEntries=[];dropLog=[];history=[];selectedUnit=null;
  document.getElementById('tickNum').textContent='0';
  document.getElementById('modeBadge').textContent='SEALED WATCH';document.getElementById('modeBadge').className='badge badge-sealed';
  document.getElementById('noskipBadge').textContent='NO SKIP';document.getElementById('noskipBadge').style.borderColor='';document.getElementById('noskipBadge').style.color='';
  document.getElementById('ctrlWatch').style.display='flex';document.getElementById('ctrlInspect').style.display='none';
  document.getElementById('startBtn').textContent='Start';document.getElementById('startBtn').style.pointerEvents='';
  U=makeUnits();E=makeEnemies();hooks.forEach(h=>h.active=false);
  buildBoard();renderBoard();updateWatchSidebar();updateClock();
}
function setSpd(ms){speed=ms;['s1','s2','s3'].forEach(id=>document.getElementById(id).classList.remove('act'));
  if(ms===2000)document.getElementById('s1').classList.add('act');if(ms===1000)document.getElementById('s2').classList.add('act');if(ms===500)document.getElementById('s3').classList.add('act');
  document.getElementById('spdLbl').textContent=(ms/1000)+'s / tick';
  if(running){clearInterval(timer);timer=setInterval(simTick,speed);}}
document.addEventListener('keydown',e=>{if(mode==='inspector'){if(e.key==='ArrowLeft')inspPrev();if(e.key==='ArrowRight')inspNext();}});
window.addEventListener('resize',()=>{buildBoard();renderBoard();});

// INIT
buildBoard();renderBoard();updateWatchSidebar();updateClock();
</script>
