<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Uprising — Plan Screen</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');
:root {
  --bg:#06080a;--panel:#0c0e12;--panel2:#0f1116;--border:#1a1d24;--blt:#252830;
  --text:#c8ccd4;--dim:#5a5e68;--muted:#3a3d44;
  --scout:#4a9eff;--relay:#8b8fa8;--striker:#ff6b35;--specialist:#a855f7;--command:#f5c542;
  --signal:#22d68a;--danger:#ff3b4a;--warn:#ffaa22;--channel1:#22d68a;--channel2:#ff6b35;--channel3:#a855f7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column}

/* TOP BAR */
.topbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--panel)}
.topbar-left{display:flex;align-items:center;gap:14px}
.plan-badge{font-size:9px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:2px;color:#fff;background:#4a9eff}
.mission-info{font-size:10px;color:var(--dim);letter-spacing:1px}
.objective{font-size:10px;color:var(--muted);margin-left:8px}
.exec-btn{background:var(--signal);color:#000;border:none;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:2px;padding:8px 24px;border-radius:3px;cursor:pointer;transition:all .15s}
.exec-btn:hover{background:#2ae69a;box-shadow:0 0 16px rgba(34,214,138,.3)}

/* MAIN SPLIT */
.main{flex:1;display:grid;grid-template-columns:1fr 340px;overflow:hidden}

/* BOARD */
.bf{position:relative;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}
.board-wrap{position:relative}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:0}
.cell{width:var(--cell);height:var(--cell);border:1px solid #1e222e;position:relative}
.cell.even{background:#0e1118}.cell.odd{background:#0b0d12}
.cell::before{content:'';position:absolute;top:0;left:0;width:5px;height:5px;border-top:1.5px solid #2a2f3e;border-left:1.5px solid #2a2f3e}
.cell::after{content:'';position:absolute;bottom:0;right:0;width:5px;height:5px;border-bottom:1.5px solid #2a2f3e;border-right:1.5px solid #2a2f3e}
/* Axis */
.ax-col{display:grid;grid-template-columns:repeat(8,var(--cell));gap:0}
.ax-row{position:absolute;left:-22px;top:0;display:flex;flex-direction:column}
.ax-lbl{font-size:10px;font-weight:600;color:#2a2f3e;display:flex;align-items:center;justify-content:center;height:var(--cell);width:20px}
.ax-lbl-c{text-align:center;font-size:10px;font-weight:600;color:#2a2f3e;height:18px;line-height:18px}

/* Cell contents */
.cell-content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.cell-icon{font-size:calc(var(--cell)*.32);line-height:1}
.cell-label{font-size:max(calc(var(--cell)*.11),7px);font-weight:600;letter-spacing:.5px;margin-top:1px}
/* Ghost units */
.ghost{opacity:.45}
.ghost.selected{opacity:.8}
/* Perception circle */
.perc-circle{position:absolute;border:1.5px dashed rgba(74,158,255,.2);border-radius:50%;pointer-events:none;z-index:1}
/* Channel wires (SVG overlay) */
.wire-svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}

/* WORKBENCH */
.wb{border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}

/* Section */
.wb-sec{border-bottom:1px solid var(--border);flex-shrink:0}
.wb-sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;cursor:pointer;user-select:none}
.wb-sec-hdr h3{font-size:9px;font-weight:600;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.wb-sec-hdr .toggle{font-size:10px;color:var(--muted);transition:transform .2s}
.wb-sec-body{padding:0 14px 12px;overflow-y:auto}

/* Blueprint list */
.bp-list{display:flex;flex-direction:column;gap:4px}
.bp-item{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;cursor:pointer;transition:all .15s;font-size:10px}
.bp-item:hover{border-color:var(--blt)}
.bp-item.active{border-color:var(--scout);background:#0c1020}
.bp-icon{font-size:14px;width:20px;text-align:center}
.bp-name{flex:1;font-weight:500}
.bp-type{font-size:8px;color:var(--muted);letter-spacing:1px}
.bp-add{display:flex;align-items:center;justify-content:center;padding:6px;border:1px dashed var(--border);border-radius:3px;cursor:pointer;font-size:10px;color:var(--muted);transition:all .15s}
.bp-add:hover{border-color:var(--blt);color:var(--dim)}

/* Blueprint editor */
.bp-editor{display:none;margin-top:8px}
.bp-editor.open{display:block}
.bp-header{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:8px}
.bp-header-icon{font-size:18px}
.bp-header-name{font-size:12px;font-weight:600;flex:1}
.bp-stats{display:flex;gap:8px;font-size:8px;color:var(--muted)}
.bp-stat{display:flex;align-items:center;gap:3px}
.bp-stat-val{color:var(--dim)}

/* Config section */
.cfg{margin-bottom:10px}
.cfg-title{font-size:8px;font-weight:600;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.cfg-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:10px}
.cfg-check{width:14px;height:14px;border:1px solid var(--border);border-radius:2px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:8px;color:var(--signal)}
.cfg-check.on{background:rgba(34,214,138,.1);border-color:var(--signal)}

/* Rules */
.rule{display:flex;align-items:center;gap:4px;padding:4px 6px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;margin-bottom:3px;font-size:9px}
.rule-num{color:var(--muted);min-width:14px;font-weight:700}
.rule-if{color:var(--warn)}
.rule-then{color:var(--signal)}
.rule-drag{color:var(--muted);cursor:grab;margin-left:auto;font-size:10px}

/* Hooks */
.hook{display:flex;align-items:center;gap:4px;padding:5px 6px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;margin-bottom:3px;font-size:9px}
.hook-trigger{color:var(--warn);min-width:60px}
.hook-arrow{color:var(--muted)}
.hook-action{color:var(--signal);min-width:50px}
.hook-channel{padding:2px 6px;border:1px solid var(--border);border-radius:2px;font-size:9px;min-width:70px}
.hook-channel.ch1{border-color:var(--channel1);color:var(--channel1);background:rgba(34,214,138,.05)}
.hook-channel.ch2{border-color:var(--channel2);color:var(--channel2);background:rgba(255,107,53,.05)}

/* Context config */
.ctx-row{display:flex;align-items:center;gap:6px;padding:2px 0;font-size:9px}
.ctx-toggle{font-size:8px;padding:1px 5px;border-radius:2px;cursor:pointer;letter-spacing:.5px;min-width:46px;text-align:center}
.ctx-toggle.listen{color:var(--signal);border:1px solid var(--signal);background:rgba(34,214,138,.05)}
.ctx-toggle.ignore{color:var(--danger);border:1px solid var(--danger);background:rgba(255,59,74,.05)}
.ctx-name{color:var(--dim)}

/* CONVEYOR BELT */
.conveyor-wrap{flex-shrink:0}
.conveyor{display:flex;gap:3px;padding:4px 0;overflow-x:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.conv-slot{width:40px;height:48px;border:1px solid var(--border);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:grab;transition:all .15s;flex-shrink:0;background:var(--panel2);position:relative}
.conv-slot:hover{border-color:var(--blt)}
.conv-icon{font-size:16px;line-height:1}
.conv-name{font-size:7px;color:var(--muted);margin-top:1px;letter-spacing:.5px}
.conv-cost{font-size:7px;color:var(--muted);position:absolute;bottom:1px}
.conv-belt{height:2px;background:repeating-linear-gradient(90deg,var(--border) 0px,var(--border) 4px,transparent 4px,transparent 8px);margin:3px 0;animation:belt 1s linear infinite}
@keyframes belt{from{background-position:0 0}to{background-position:8px 0}}
.conv-summary{font-size:8px;color:var(--muted);padding:4px 0;display:flex;gap:8px}
.conv-summary span{color:var(--dim)}

/* CHANNEL MAP */
.ch-map-scroll{max-height:100px;overflow-y:auto}
.ch-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:9px;cursor:pointer;transition:opacity .15s}
.ch-row:hover{opacity:.8}
.ch-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ch-name{min-width:70px;font-weight:500}
.ch-flow{color:var(--dim);flex:1}
.ch-warn{color:var(--danger);font-size:8px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="plan-badge">PLAN PHASE</div>
    <div class="mission-info">MISSION 5 — ASSEMBLY LINE</div>
    <div class="objective">Objective: Eliminate all enemy patrols</div>
  </div>
  <button class="exec-btn" onclick="executeTransition()">EXECUTE ▶</button>
</div>

<div class="main">
  <div class="bf" id="bfContainer">
    <div class="board-wrap" id="boardWrap">
      <div class="ax-row" id="axRow"></div>
      <div class="board" id="board"></div>
      <div class="ax-col" id="axCol"></div>
      <svg class="wire-svg" id="wireSvg"></svg>
    </div>
  </div>

  <div class="wb">
    <!-- BLUEPRINTS -->
    <div class="wb-sec" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div class="wb-sec-hdr"><h3>Blueprints</h3><span class="toggle">▾</span></div>
      <div class="wb-sec-body" style="flex:1;overflow-y:auto" id="bpPanel">
        <div class="bp-list" id="bpList"></div>
        <div class="bp-editor open" id="bpEditor"></div>
      </div>
    </div>

    <!-- PRODUCTION QUEUE -->
    <div class="wb-sec conveyor-wrap">
      <div class="wb-sec-hdr"><h3>Production Queue</h3></div>
      <div class="wb-sec-body">
        <div class="conv-belt"></div>
        <div class="conveyor" id="conveyor"></div>
        <div class="conv-belt"></div>
        <div class="conv-summary" id="convSummary"></div>
      </div>
    </div>

    <!-- CHANNEL MAP -->
    <div class="wb-sec">
      <div class="wb-sec-hdr"><h3>Channel Map</h3></div>
      <div class="wb-sec-body">
        <div class="ch-map-scroll" id="channelMap"></div>
      </div>
    </div>
  </div>
</div>

<script>
const GW=8,GH=8;
const CHANNEL_COLORS = {'recon-net':'#22d68a','strike-net':'#ff6b35','cmd-net':'#a855f7'};

// === BLUEPRINT DATA ===
const blueprints = [
  {
    id:'scout-alpha', name:'Scout-Alpha', type:'scout', icon:'👁',
    color:'#4a9eff', buf:6, hooks:2, perc:3, spd:'Fast', cost:'3m',
    skills:[{name:'patrol',on:true},{name:'evade',on:false}],
    rules:[
      {n:1,cond:'threat in buffer',act:'move_toward'},
      {n:2,cond:'no threat',act:'patrol'},
    ],
    hookCfg:[
      {trigger:'on_detect',action:'send',channel:'recon-net'},
      {trigger:'—',action:'—',channel:''},
    ],
    context:[
      {name:'Floor vibration',mode:'ignore'},
      {name:'EM hum',mode:'ignore'},
      {name:'Thermal',mode:'ignore'},
      {name:'Movement',mode:'listen'},
      {name:'Threat alert',mode:'listen'},
    ],
  },
  {
    id:'relay-main', name:'Relay-Main', type:'relay', icon:'📡',
    color:'#8b8fa8', buf:12, hooks:4, perc:0, spd:'Static', cost:'5m',
    skills:[{name:'compress',on:false},{name:'filter',on:true}],
    rules:[
      {n:1,cond:'signal received',act:'forward'},
    ],
    hookCfg:[
      {trigger:'on_receive',action:'forward',channel:'recon-net'},
      {trigger:'on_forward',action:'send',channel:'strike-net'},
      {trigger:'—',action:'—',channel:''},
      {trigger:'—',action:'—',channel:''},
    ],
    context:[],
  },
  {
    id:'striker-assault', name:'Striker-Assault', type:'striker', icon:'⚔',
    color:'#ff6b35', buf:8, hooks:2, perc:2, spd:'Med', cost:'8m',
    skills:[{name:'engage',on:true},{name:'breach',on:false}],
    rules:[
      {n:1,cond:'threat in buffer',act:'move_toward'},
      {n:2,cond:'no threat',act:'hold position'},
    ],
    hookCfg:[
      {trigger:'on_receive',action:'—',channel:'strike-net'},
      {trigger:'—',action:'—',channel:''},
    ],
    context:[
      {name:'Floor vibration',mode:'ignore'},
      {name:'EM hum',mode:'ignore'},
      {name:'Thermal',mode:'listen'},
      {name:'Movement',mode:'listen'},
      {name:'Threat alert',mode:'listen'},
    ],
  },
];

// Production queue
const queue = [
  {bp:'scout-alpha'},{bp:'scout-alpha'},{bp:'scout-alpha'},
  {bp:'relay-main'},
  {bp:'striker-assault'},{bp:'striker-assault'},
];

// Board entities
const base = {x:0,y:0};
const enemies = [{x:4,y:1},{x:6,y:2},{x:7,y:4},{x:6,y:6},{x:4,y:7}];
const nodes = [{x:5,y:3},{x:6,y:6}];

// Ghost positions (near base, in queue order)
const ghostPositions = [[1,0],[1,1],[0,1],[2,1],[2,0],[0,2]];

let activeBp = 'scout-alpha';
let hoveredChannel = null;

// === BUILD BOARD ===
function buildBoard(){
  const bf=document.getElementById('bfContainer');
  const maxH=bf.clientHeight-30, maxW=bf.clientWidth-50;
  const cellPx=Math.floor(Math.min(maxH/GH, maxW/GW, 68));
  document.documentElement.style.setProperty('--cell',cellPx+'px');

  const board=document.getElementById('board');
  board.innerHTML='';
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
    const c=document.createElement('div');
    c.className='cell '+((x+y)%2===0?'even':'odd');
    c.id=`c${x}_${y}`;
    board.appendChild(c);
  }
  // Axes
  const axCol=document.getElementById('axCol');
  axCol.innerHTML='';
  for(let x=0;x<GW;x++){const l=document.createElement('div');l.className='ax-lbl-c';l.textContent=String.fromCharCode(65+x);l.style.width='var(--cell)';axCol.appendChild(l);}
  const axRow=document.getElementById('axRow');
  axRow.innerHTML='';
  for(let y=0;y<GH;y++){const l=document.createElement('div');l.className='ax-lbl';l.textContent=y+1;axRow.appendChild(l);}
}

function renderBoard(){
  // Clear contents
  document.querySelectorAll('.cell-content,.perc-circle').forEach(e=>e.remove());

  // Base
  placeOnCell(base.x, base.y, '🏭', 'BASE', '#5a5e68', false);

  // Enemies
  enemies.forEach(e => placeOnCell(e.x, e.y, '🤖', 'ENEMY', '#ff3b4a', false));

  // Material nodes
  nodes.forEach(n => placeOnCell(n.x, n.y, '⬡', 'NODE', '#22d68a', false));

  // Ghost units (from queue)
  queue.forEach((q,i) => {
    if(i >= ghostPositions.length) return;
    const bp = blueprints.find(b=>b.id===q.bp);
    const [gx,gy] = ghostPositions[i];
    const isSelected = bp.id === activeBp;
    placeOnCell(gx, gy, bp.icon, bp.name.split('-')[0].substring(0,3).toUpperCase(), bp.color, true, isSelected);

    // Perception radius for scouts
    if(bp.type === 'scout'){
      const cell = document.getElementById(`c${gx}_${gy}`);
      if(cell){
        const cellPx = cell.offsetWidth;
        const r = bp.perc * cellPx;
        const circ = document.createElement('div');
        circ.className = 'perc-circle';
        circ.style.width = r*2+'px';
        circ.style.height = r*2+'px';
        circ.style.left = (cellPx/2 - r)+'px';
        circ.style.top = (cellPx/2 - r)+'px';
        cell.appendChild(circ);
      }
    }
  });

  // Channel wires
  renderWires();
}

function placeOnCell(x,y,icon,label,color,ghost,selected){
  const cell = document.getElementById(`c${x}_${y}`);
  if(!cell) return;
  const el = document.createElement('div');
  el.className = 'cell-content' + (ghost ? ' ghost' : '') + (selected ? ' selected' : '');
  el.innerHTML = `<div class="cell-icon">${icon}</div><div class="cell-label" style="color:${color}">${label}</div>`;
  cell.appendChild(el);
}

function renderWires(){
  const svg = document.getElementById('wireSvg');
  const wrap = document.getElementById('boardWrap');
  const wrapRect = wrap.getBoundingClientRect();
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${wrapRect.width} ${wrapRect.height}`);

  // Draw channel connections between ghost units
  const channels = {};
  queue.forEach((q,i) => {
    if(i >= ghostPositions.length) return;
    const bp = blueprints.find(b=>b.id===q.bp);
    bp.hookCfg.forEach(h => {
      if(!h.channel || h.channel === '') return;
      if(!channels[h.channel]) channels[h.channel] = {senders:[],listeners:[]};
      if(h.action === 'send' || h.action === 'forward') channels[h.channel].senders.push(i);
      if(h.trigger === 'on_receive' || h.action === 'forward') channels[h.channel].listeners.push(i);
    });
  });

  Object.entries(channels).forEach(([chName, ch]) => {
    const color = CHANNEL_COLORS[chName] || '#5a5e68';
    const dimmed = hoveredChannel && hoveredChannel !== chName;
    ch.senders.forEach(si => {
      ch.listeners.forEach(li => {
        if(si === li) return;
        const [sx,sy] = ghostPositions[si];
        const [lx,ly] = ghostPositions[li];
        const fromCell = document.getElementById(`c${sx}_${sy}`);
        const toCell = document.getElementById(`c${lx}_${ly}`);
        if(!fromCell || !toCell) return;
        const fc = fromCell.getBoundingClientRect();
        const tc = toCell.getBoundingClientRect();
        const x1 = fc.left - wrapRect.left + fc.width/2;
        const y1 = fc.top - wrapRect.top + fc.height/2;
        const x2 = tc.left - wrapRect.left + tc.width/2;
        const y2 = tc.top - wrapRect.top + tc.height/2;

        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        line.setAttribute('x1',x1);line.setAttribute('y1',y1);
        line.setAttribute('x2',x2);line.setAttribute('y2',y2);
        line.setAttribute('stroke',color);
        line.setAttribute('stroke-width', dimmed ? '1' : '2');
        line.setAttribute('stroke-dasharray','6,4');
        line.setAttribute('opacity', dimmed ? '0.1' : '0.4');
        svg.appendChild(line);
      });
    });
  });
}

// === WORKBENCH ===
function renderBpList(){
  const list = document.getElementById('bpList');
  list.innerHTML = '';
  blueprints.forEach(bp => {
    const item = document.createElement('div');
    item.className = 'bp-item' + (bp.id === activeBp ? ' active' : '');
    item.innerHTML = `<span class="bp-icon">${bp.icon}</span><span class="bp-name">${bp.name}</span><span class="bp-type">${bp.type.toUpperCase()}</span>`;
    item.onclick = () => { activeBp = bp.id; render(); };
    list.appendChild(item);
  });
  const add = document.createElement('div');
  add.className = 'bp-add';
  add.textContent = '+ New Blueprint';
  list.appendChild(add);
}

function renderBpEditor(){
  const bp = blueprints.find(b=>b.id===activeBp);
  if(!bp){document.getElementById('bpEditor').innerHTML='';return;}
  const ed = document.getElementById('bpEditor');
  let h = '';

  // Header
  h += `<div class="bp-header">
    <span class="bp-header-icon">${bp.icon}</span>
    <span class="bp-header-name" style="color:${bp.color}">${bp.name}</span>
  </div>`;
  h += `<div class="bp-stats">
    <div class="bp-stat">BUF <span class="bp-stat-val">${bp.buf}</span></div>
    <div class="bp-stat">HOOKS <span class="bp-stat-val">${bp.hooks}</span></div>
    <div class="bp-stat">PERC <span class="bp-stat-val">${bp.perc}</span></div>
    <div class="bp-stat">SPD <span class="bp-stat-val">${bp.spd}</span></div>
    <div class="bp-stat">COST <span class="bp-stat-val">${bp.cost}</span></div>
  </div>`;

  // Skills
  h += `<div class="cfg"><div class="cfg-title">Skills</div>`;
  bp.skills.forEach(s => {
    h += `<div class="cfg-row"><div class="cfg-check ${s.on?'on':''}">${s.on?'✓':''}</div><span>${s.name}</span></div>`;
  });
  h += '</div>';

  // Rules
  h += `<div class="cfg"><div class="cfg-title">Rules (priority order)</div>`;
  bp.rules.forEach(r => {
    h += `<div class="rule"><span class="rule-num">${r.n}.</span><span class="rule-if">IF</span> ${r.cond} <span class="rule-then">→</span> ${r.act}<span class="rule-drag">⋮⋮</span></div>`;
  });
  h += '</div>';

  // Hooks
  if(bp.hookCfg.length > 0){
    h += `<div class="cfg"><div class="cfg-title">Hooks (${bp.hookCfg.filter(h=>h.channel).length}/${bp.hooks} slots)</div>`;
    bp.hookCfg.forEach((hk,i) => {
      if(hk.trigger === '—'){
        h += `<div class="hook" style="opacity:.3"><span style="color:var(--muted)">Empty slot ${i+1}</span></div>`;
      } else {
        const chClass = hk.channel === 'recon-net' ? 'ch1' : hk.channel === 'strike-net' ? 'ch2' : '';
        h += `<div class="hook">
          <span class="hook-trigger">${hk.trigger}</span>
          <span class="hook-arrow">→</span>
          <span class="hook-action">${hk.action}</span>
          <span class="hook-arrow">on</span>
          <span class="hook-channel ${chClass}">${hk.channel || '...'}</span>
        </div>`;
      }
    });
    h += '</div>';
  }

  // Context
  if(bp.context.length > 0){
    h += `<div class="cfg"><div class="cfg-title">Context Config</div>`;
    bp.context.forEach(c => {
      h += `<div class="ctx-row"><span class="ctx-toggle ${c.mode}">${c.mode.toUpperCase()}</span><span class="ctx-name">${c.name}</span></div>`;
    });
    h += '</div>';
  }

  ed.innerHTML = h;
}

function renderConveyor(){
  const conv = document.getElementById('conveyor');
  conv.innerHTML = '';
  let totalCost = 0;
  queue.forEach(q => {
    const bp = blueprints.find(b=>b.id===q.bp);
    const slot = document.createElement('div');
    slot.className = 'conv-slot';
    slot.style.borderColor = bp.color + '40';
    const cost = parseInt(bp.cost);
    totalCost += cost;
    slot.innerHTML = `<span class="conv-icon">${bp.icon}</span><span class="conv-name">${bp.name.split('-')[1] || bp.name.substring(0,3)}</span><span class="conv-cost">${bp.cost}</span>`;
    conv.appendChild(slot);
  });
  document.getElementById('convSummary').innerHTML = `
    Total: <span>${totalCost}m</span> |
    Income: <span>5m/tick</span> |
    Full deploy: <span>~tick ${Math.ceil(totalCost/5)}</span>
  `;
}

function renderChannelMap(){
  const map = document.getElementById('channelMap');
  // Build channels from blueprint hooks
  const channels = {};
  blueprints.forEach(bp => {
    bp.hookCfg.forEach(hk => {
      if(!hk.channel) return;
      if(!channels[hk.channel]) channels[hk.channel] = {senders:[],listeners:[]};
      if(hk.action === 'send') channels[hk.channel].senders.push(bp.name.split('-')[0]);
      if(hk.trigger === 'on_receive') channels[hk.channel].listeners.push(bp.name.split('-')[0]);
      if(hk.action === 'forward' && hk.trigger === 'on_receive') {
        // relay both listens and may send on another channel
      }
      if(hk.action === 'forward' && hk.trigger !== 'on_receive') {
        channels[hk.channel].senders.push(bp.name.split('-')[0]);
      }
    });
  });

  let h = '';
  Object.entries(channels).forEach(([name, ch]) => {
    const color = CHANNEL_COLORS[name] || '#5a5e68';
    const senders = [...new Set(ch.senders)].join(', ') || '?';
    const listeners = [...new Set(ch.listeners)].join(', ') || '?';
    const warn = listeners === '?' ? '<span class="ch-warn">⚠ no listeners</span>' : '';
    h += `<div class="ch-row" onmouseenter="hoverChannel('${name}')" onmouseleave="hoverChannel(null)">
      <div class="ch-dot" style="background:${color}"></div>
      <span class="ch-name" style="color:${color}">${name}</span>
      <span class="ch-flow">${senders} → ${listeners}</span>
      ${warn}
    </div>`;
  });
  map.innerHTML = h;
}

function hoverChannel(name){
  hoveredChannel = name;
  renderWires();
}

// === EXECUTE TRANSITION ===
function executeTransition(){
  const btn = document.querySelector('.exec-btn');
  btn.textContent = 'DEPLOYING...';
  btn.style.background = '#ffaa22';
  // Flash ghosts to solid briefly
  document.querySelectorAll('.ghost').forEach(g => {
    g.style.transition = 'opacity .5s';
    g.style.opacity = '1';
  });
  setTimeout(() => {
    btn.textContent = '→ SEALED WATCH';
    btn.style.background = '#ff3b4a';
  }, 1500);
}

// === RENDER ALL ===
function render(){
  renderBpList();
  renderBpEditor();
  renderConveyor();
  renderChannelMap();
  renderBoard();
}

window.addEventListener('resize', () => { buildBoard(); render(); });
buildBoard();
render();
</script>
</body>
</html>
