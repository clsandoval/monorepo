# Japanese Curriculum Schedule
# Pre-allocated vocab and grammar per episode — prevents parallel dispatch collisions.
# Status: queued | dispatched | completed
# Goal: conversational fluency (JLPT N5 → natural speech)
#
# Pacing (moderate ramp + comprehension gating):
#   - 5-6 new vocab per episode
#   - 1 new grammar every 2 episodes (vocab-only episodes alternate)
#   - Ratio bumps every 14 episodes OR when items from 2 eps ago hit exposure >= 4
#
# Ratio ramp tiers (see profile.yaml):
#   0.20 (ep 1-14) → 0.30 (15-28) → 0.45 (29-42) → 0.60 (43-56) → 0.80 (57-70) → 1.0 (71+)

# ============================================================
# Tier 1: Ratio 0.20 — Build vocabulary base
# ============================================================

