# ============================================================
# PARTICLES
# ============================================================

- pattern: "は"
  meaning: "topic marker"
  status: solid
  exposures: 0
  introduced_in: duolingo
  examples:
    - jp: 私は学生です
      en: I am a student
  tags: [particle, topic]

- pattern: "が"
  meaning: "subject marker / identifier"
  status: solid
  exposures: 0
