name: PodPlay Ops QA2 Forward Loop

on:
  workflow_dispatch:
    inputs:
      max_iterations:
        description: "Max iterations (default 50)"
        required: false
        default: "90"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.status.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Check loop status
        id: status
        run: |
          LOOP_DIR="loops/podplay-ops-qa2-forward"
          if [ -f "$LOOP_DIR/status/converged.txt" ]; then
            echo "Loop already converged. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -f "$LOOP_DIR/status/paused.txt" ]; then
            echo "Loop is paused. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  run-loop:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configure git
        run: |
          git config user.name "ralph-loop[bot]"
          git config user.email "ralph-loop[bot]@users.noreply.github.com"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local
        run: |
          cd apps/podplay
          npx supabase start
          echo "Supabase local running on 127.0.0.1:54321"

      - name: Install app dependencies
        run: |
          cd apps/podplay
          npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run until convergence (6-hour window)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd "loops/podplay-ops-qa2-forward"
          FAILURES=0
          ITERATION=0
          MAX_ITERATIONS=${{ github.event.inputs.max_iterations || '90' }}

          while true; do
            if [ -f status/converged.txt ]; then
              echo "Loop converged after $ITERATION iterations."
              break
            fi

            if [ $ITERATION -ge $MAX_ITERATIONS ]; then
              echo "Max iterations ($MAX_ITERATIONS) reached."
              break
            fi

            ITERATION=$((ITERATION + 1))
            echo "--- $(date '+%H:%M:%S') | Iteration $ITERATION / $MAX_ITERATIONS ---"

            # Per-iteration timeout: 30 minutes max
            if timeout 1800 bash -c '
              unset CLAUDECODE
              cat PROMPT.md | claude --model claude-opus-4-6 --print --dangerously-skip-permissions
            '; then
              FAILURES=0
            else
              EXIT_CODE=$?
              if [ "$EXIT_CODE" -eq 124 ]; then
                echo "WARNING: iteration $ITERATION timed out after 1800s"
              else
                echo "WARNING: iteration $ITERATION exited with code $EXIT_CODE"
              fi
              FAILURES=$((FAILURES + 1))
              [ $FAILURES -ge 3 ] && echo "3 consecutive failures — stopping." && break
            fi

            # Push any local commits
            cd "$(git rev-parse --show-toplevel)"
            git add -A
            git diff --cached --quiet || git commit -m "loop(podplay-ops-qa2-forward): iteration $ITERATION"
            if git log origin/${{ github.ref_name }}..HEAD --oneline | grep -q .; then
              git pull --rebase origin "${{ github.ref_name }}" || true
              git push || echo "WARNING: Push failed"
            fi
            cd "loops/podplay-ops-qa2-forward"

            sleep 5
          done

          echo "Done. Total iterations: $ITERATION"

      - name: Check convergence and notify
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          LOOP_DIR="loops/podplay-ops-qa2-forward"
          if [ -f "$LOOP_DIR/status/converged.txt" ]; then
            echo "PodPlay Ops forward loop has converged!"

            ITER_COUNT=$(git log --oneline --grep="podplay(qa2-forward)" | wc -l)

            gh issue create \
              --title "[ralph] podplay-ops-qa2-forward converged ($ITER_COUNT iterations)" \
              --label "ralph-converged" \
              --body "$(cat <<ISSUEEOF
          ## Loop Converged

          **Loop:** podplay-ops-qa2-forward
          **Iterations:** ~$ITER_COUNT
          **Output:** \`apps/podplay/\`

          QA round 2 complete — 21 findings from Marco addressed. Review and deploy.

          ### Convergence Summary
          \`\`\`
          $(cat "$LOOP_DIR/status/converged.txt")
          \`\`\`
          ISSUEEOF
            )" || echo "WARNING: Could not create issue"

            # Update registry
            cd "$(git rev-parse --show-toplevel)"
            if command -v yq &> /dev/null; then
              yq -i '.loops.podplay-ops-qa2-forward.status = "converged" | .loops.podplay-ops-qa2-forward.converged_at = "'"$(date -u +%Y-%m-%d)"'"' loops/_registry.yaml
            fi
            git add loops/_registry.yaml
            git commit -m "loop(podplay-ops-qa2-forward): mark converged in registry" || true
            git push || true
          fi
