# Inheritance CI — the enforcement point for GATE-01 through GATE-04.
#
# All gate logic lives in apps/inheritance/scripts/ci-gates.sh, not in this file,
# so what CI runs and what a developer runs are the same bytes and a failure here
# is reproducible and debuggable locally rather than only after a push.
#
# No step in this workflow may be made non-blocking. Non-blocking step options,
# error swallowing, and unconditionally-run gate steps are all prohibited: a gate
# that can report green while failing certifies nothing, and in this project a
# wrong legal number reaching a lawyer silently is the failure mode that matters
# most.
#
# This is a separate workflow from inheritance.yml (the Ralph forward-loop
# runner), which is unrelated and must not be modified.

name: Inheritance CI

on:
  # No branches filter: this must fire on every branch.
  # The paths scope is necessary because this monorepo has a concurrent
  # auto-committer producing frequent unrelated commits; without it every
  # unrelated commit would trigger a full Rust + WASM + Node run.
  push:
    paths:
      - 'apps/inheritance/**'
      - '.github/workflows/inheritance-ci.yml'
  pull_request:
    paths:
      - 'apps/inheritance/**'
      - '.github/workflows/inheritance-ci.yml'

jobs:
  gates:
    runs-on: ubuntu-latest
    # Raised 45 -> 60 by phase 12, which added G19, G20 and G21: one more
    # `npm run build`, one more browser launch and fourteen page loads. The
    # whole set takes ~4m12s on the owner's machine. UNMEASURED, and recorded
    # as a risk rather than a claim: no CI run has ever executed for this
    # project, so whether twenty gates fit inside sixty minutes on a
    # GitHub-hosted runner is not known from that machine.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          # llvm-profdata and llvm-cov, used by gate G12 (scripts/coverage-report.sh).
          # A rustup component, not a crate: no cargo-llvm-cov, no tarpaulin, and
          # engine/Cargo.toml and engine/Cargo.lock stay untouched.
          components: llvm-tools-preview

      # wasm-pack resolves the wasm-bindgen version from the committed
      # engine/Cargo.lock, so no version is pinned here.
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/inheritance/frontend/package-lock.json

      # npm ci, strictly from the committed package-lock.json (lockfileVersion 3),
      # which is the only lockfile this tree has.
      - name: Install frontend dependencies
        working-directory: apps/inheritance/frontend
        run: npm ci

      # Gates G18 (tenant isolation) and G17 (live journey run) drive a REAL local
      # Supabase stack; G17 additionally needs a built application and a browser.
      #
      # UNMEASURED: this project's CI has never executed — that is Phase 1's
      # GATE-04 finding — so whether `supabase start` succeeds on a GitHub-hosted
      # runner is not known from the development machine. It is recorded here as a
      # risk rather than asserted as working.
      #
      # If either step fails, the workflow fails. That is deliberate and must not
      # be softened: scripts/ci-gates.sh halts with exit 2 on a false precondition
      # and maps every other nonzero to GATE FAILED, and a gate that quietly did
      # not run certifies nothing.
      #
      # The CLI version matches the one measured on the development machine, so CI
      # and local run the same bytes.
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.110.0

      - name: Start local Supabase stack
        working-directory: apps/inheritance/frontend
        run: supabase start

      - name: Install Playwright chromium
        working-directory: apps/inheritance/frontend
        run: npx playwright install --with-deps chromium

      - name: Run all gates
        run: bash apps/inheritance/scripts/ci-gates.sh
