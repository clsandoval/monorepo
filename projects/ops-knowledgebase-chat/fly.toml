app = "ops-knowledgebase-chat"
primary_region = "sea"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true

[mounts]
  source = "workspace"
  destination = "/workspace"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

[checks.health]
  type = "http"
  port = 8080
  path = "/health"
  interval = "30s"
  timeout = "5s"
