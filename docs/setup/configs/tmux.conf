# ─── Prefix ──────────────────────────────────────────────────────────────
unbind C-b
set -g prefix `
bind ` send-prefix

# ─── General ─────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ─── Reload config ───────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "config reloaded"

# ─── Splits (intuitive: | vertical, - horizontal, open in cwd) ───────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ─── Pane navigation (vim-style hjkl) ────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane resize (repeatable: hold prefix, tap H/J/K/L) ──────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ─── Window navigation ───────────────────────────────────────────────────
bind -n M-[ previous-window
bind -n M-] next-window
bind P paste-buffer

# ─── Copy mode (vim keys) ────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"

# ─── Status bar ──────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=default fg=white"
set -g status-left "#[fg=cyan,bold] #S #[default]│ "
set -g status-left-length 30
set -g status-right "#[fg=yellow]%H:%M #[fg=cyan]%a %d-%b"
set -g status-right-length 40
setw -g window-status-current-style "fg=#000000,bg=#ffd75f,bold"
setw -g window-status-style "fg=#888888,bg=default"
setw -g window-status-format " #I:#W "
setw -g window-status-current-format " #I:#W "

# ─── Auto-log every pane to ~/.tmux-logs/YYYY-MM-DD/<session>-<window>-<pane>.log ─
# Survives pane close. Date stamp = pane creation. Reloading the config re-arms
# hooks but does NOT re-attach pipe-pane to existing panes — use prefix+W to
# bootstrap currently-running panes once after install.
set-hook -g session-created    "pipe-pane -O 'mkdir -p $HOME/.tmux-logs/$(date +%Y-%m-%d); exec cat >> $HOME/.tmux-logs/$(date +%Y-%m-%d)/#{session_name}-#{window_index}-#{pane_index}.log'"
set-hook -g after-new-window   "pipe-pane -O 'mkdir -p $HOME/.tmux-logs/$(date +%Y-%m-%d); exec cat >> $HOME/.tmux-logs/$(date +%Y-%m-%d)/#{session_name}-#{window_index}-#{pane_index}.log'"
set-hook -g after-split-window "pipe-pane -O 'mkdir -p $HOME/.tmux-logs/$(date +%Y-%m-%d); exec cat >> $HOME/.tmux-logs/$(date +%Y-%m-%d)/#{session_name}-#{window_index}-#{pane_index}.log'"

# Bootstrap: arm pipe-pane on every currently-existing pane (run once after install)
bind W run-shell "tmux list-panes -a -F '#{session_name} #{window_index} #{pane_index}' | while read s w p; do tmux pipe-pane -t \"\\$s:\\$w.\\$p\" -O \"mkdir -p $HOME/.tmux-logs/\\$(date +%Y-%m-%d); exec cat >> $HOME/.tmux-logs/\\$(date +%Y-%m-%d)/\\$s-\\$w-\\$p.log\"; done; tmux display 'tmux logging armed on all panes'"

# Manual snapshot of current pane's full scrollback (50k lines per history-limit)
bind S run-shell "tmux capture-pane -p -S - > $HOME/.tmux-logs/snapshot-#{session_name}-#{window_index}-#{pane_index}-$(date +%Y%m%dT%H%M%S).log && tmux display 'snapshot saved'"

# ─── Plugins (TPM) ───────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
